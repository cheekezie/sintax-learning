<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101935" />
      <stop offset="55%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080d1c" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2740" />
      <stop offset="100%" stop-color="#131d33" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a47" />
      <stop offset="100%" stop-color="#e8692a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff8a47" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ff8a47" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect width="900" height="1200" fill="url(#glow)" />

  <!-- soft floating dots -->
  <circle cx="120" cy="160" r="4" fill="#ff8a47" opacity="0.6" />
  <circle cx="760" cy="220" r="6" fill="#ff8a47" opacity="0.35" />
  <circle cx="800" cy="900" r="5" fill="#ff8a47" opacity="0.4" />
  <circle cx="100" cy="1020" r="4" fill="#ff8a47" opacity="0.5" />
  <circle cx="150" cy="620" r="3" fill="#ffffff" opacity="0.25" />
  <circle cx="770" cy="620" r="3" fill="#ffffff" opacity="0.25" />

  <!-- code brackets top left -->
  <text x="90" y="260" font-family="monospace" font-size="72" fill="#ffffff" opacity="0.08">&lt;/&gt;</text>
  <!-- terminal glyph bottom right -->
  <text x="640" y="1080" font-family="monospace" font-size="60" fill="#ffffff" opacity="0.07">{ }</text>

  <!-- orbit rings around center -->
  <ellipse cx="450" cy="560" rx="290" ry="290" fill="none" stroke="#ffffff" stroke-opacity="0.06" />
  <ellipse cx="450" cy="560" rx="230" ry="230" fill="none" stroke="#ffffff" stroke-opacity="0.05" />

  <!-- floating book (left) -->
  <g transform="translate(160,430) rotate(-8)">
    <rect x="0" y="0" width="110" height="14" rx="3" fill="#ff8a47" />
    <rect x="0" y="14" width="110" height="70" rx="4" fill="#1c2740" stroke="#ff8a47" stroke-opacity="0.4" />
    <line x1="55" y1="14" x2="55" y2="84" stroke="#ff8a47" stroke-opacity="0.5" />
    <line x1="14" y1="30" x2="46" y2="30" stroke="#ffffff" stroke-opacity="0.25" />
    <line x1="14" y1="45" x2="46" y2="45" stroke="#ffffff" stroke-opacity="0.25" />
    <line x1="64" y1="30" x2="96" y2="30" stroke="#ffffff" stroke-opacity="0.25" />
    <line x1="64" y1="45" x2="96" y2="45" stroke="#ffffff" stroke-opacity="0.25" />
  </g>

  <!-- floating lightbulb (right) -->
  <g transform="translate(660,760)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ff8a47" stroke-width="3" stroke-opacity="0.7" />
    <path d="M -10 10 L 10 10 L 8 22 L -8 22 Z" fill="#ff8a47" opacity="0.8" />
    <line x1="-6" y1="26" x2="6" y2="26" stroke="#ff8a47" stroke-width="2" opacity="0.8" />
    <path d="M -14 -8 Q 0 -30 14 -8" fill="none" stroke="#ff8a47" stroke-width="2" opacity="0.5" />
  </g>

  <!-- laptop -->
  <g transform="translate(300,470)">
    <!-- base -->
    <rect x="-40" y="230" width="380" height="18" rx="6" fill="#1c2740" />
    <rect x="-40" y="230" width="380" height="6" rx="3" fill="#ff8a47" opacity="0.5" />

    <!-- screen -->
    <rect x="10" y="0" width="280" height="230" rx="14" fill="url(#screenGrad)" stroke="#ff8a47" stroke-opacity="0.35" stroke-width="2" />
    <rect x="30" y="24" width="240" height="182" rx="6" fill="#0b1126" />

    <!-- code lines -->
    <rect x="48" y="42" width="80" height="8" rx="4" fill="#ff8a47" opacity="0.85" />
    <rect x="48" y="60" width="140" height="8" rx="4" fill="#ffffff" opacity="0.4" />
    <rect x="66" y="78" width="110" height="8" rx="4" fill="#ffffff" opacity="0.3" />
    <rect x="66" y="96" width="90" height="8" rx="4" fill="#ffffff" opacity="0.3" />
    <rect x="48" y="114" width="60" height="8" rx="4" fill="#ff8a47" opacity="0.7" />
    <rect x="48" y="132" width="150" height="8" rx="4" fill="#ffffff" opacity="0.25" />
    <rect x="66" y="150" width="120" height="8" rx="4" fill="#ffffff" opacity="0.25" />
    <rect x="48" y="168" width="100" height="8" rx="4" fill="#ff8a47" opacity="0.5" />

    <!-- graduation cap sitting on screen -->
    <g transform="translate(150,-38)">
      <polygon points="0,-18 78,4 0,26 -78,4" fill="url(#capGrad)" />
      <rect x="-14" y="4" width="28" height="30" rx="3" fill="#e8692a" />
      <line x1="60" y1="9" x2="60" y2="46" stroke="#101935" stroke-width="3" />
      <circle cx="60" cy="50" r="5" fill="#101935" />
    </g>
  </g>

  <!-- ground shadow -->
  <ellipse cx="450" cy="760" rx="220" ry="18" fill="#000000" opacity="0.25" />
</svg>
