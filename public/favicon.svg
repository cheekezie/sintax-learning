<svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Light mode: dark back diamond on white bg */
    @media (prefers-color-scheme: light) {
      .diamond-back  { fill: #111827; fill-opacity: 0.75; stroke: #374151; }
      .diamond-back-border { stroke: #374151; }
    }
    /* Dark mode: white/light back diamond on dark bg */
    @media (prefers-color-scheme: dark) {
      .diamond-back  { fill: #ffffff; fill-opacity: 0.55; stroke: #9CA3AF; }
    }
    /* Fallback (no media query support) */
    .diamond-back  { fill: #111827; fill-opacity: 0.75; stroke: #374151; }
  </style>

  <!-- Orange diamond (always orange) -->
  <path
    d="M8.73 9.27 C10.00 8.00 10.00 8.00 11.27 9.27 L14.73 12.73 C16.00 14.00 16.00 14.00 14.73 15.27 L11.27 18.73 C10.00 20.00 10.00 20.00 8.73 18.73 L5.27 15.27 C4.00 14.00 4.00 14.00 5.27 12.73 Z"
    fill="#E8692A"
    stroke="#FF8C4A"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Back diamond — colour adapts to OS theme -->
  <path
    class="diamond-back"
    d="M16.73 9.27 C18.00 8.00 18.00 8.00 19.27 9.27 L22.73 12.73 C24.00 14.00 24.00 14.00 22.73 15.27 L19.27 18.73 C18.00 20.00 18.00 20.00 16.73 18.73 L13.27 15.27 C12.00 14.00 12.00 14.00 13.27 12.73 Z"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
</svg>